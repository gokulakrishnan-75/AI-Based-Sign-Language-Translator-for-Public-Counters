services:
  # =========================================================================
  # SIGNBRIDGE AI - Unified Web Service (FastAPI Backend + React Frontend SPA)
  # Deploys as a single free-tier Web Service on Render with zero-configuration
  # =========================================================================
  - type: web
    name: signbridge-ai
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
