services:
  # =========================================================================
  # 1. FastAPI Python Backend Web Service
  # =========================================================================
  - type: web
    name: signbridge-backend
    runtime: python
    rootDir: signbridge-ai
    plan: free
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

  # =========================================================================
  # 2. React + Vite Frontend Static Site
  # =========================================================================
  - type: static
    name: signbridge-frontend
    rootDir: signbridge-ai/frontend
    plan: free
    region: oregon
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: signbridge-backend
          property: host
